{{ define "main" }}
  <article class="home-page">
    {{ partial "home/hero.html" . }}

    {{ if .Content }}
      {{ partial "page-content.html" . }}
    {{ end }}

    {{ if ne .Params.showNews false }}
      {{ partial "home/news.html" . }}
    {{ end }}

    {{ if ne .Params.showPublications false }}
      {{ partial "home/publications.html" . }}
    {{ end }}
  </article>
{{ end }}
